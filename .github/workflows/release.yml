name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Require complete CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish installable ZIP
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build release ZIP
        run: python scripts/build.py --output dist/yt-dlp-candfans.zip
      - name: Verify release payload and write checksum
        run: python scripts/verify_archive.py --archive dist/yt-dlp-candfans.zip --checksums dist/SHA256SUMS.txt
      - name: Create GitHub Release with direct-download assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/yt-dlp-candfans.zip dist/SHA256SUMS.txt \
            --verify-tag --generate-notes --title "$RELEASE_TAG"
